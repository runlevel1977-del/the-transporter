# The Transporter for UGREEN NAS (UGOS)
#
# Image comes from GitHub Release tars (docker load) — not from the UPK app.
# Do not add this as a "Docker project" in the UGOS GUI (host/privileged
# will fail). Use: sudo docker compose up -d
#
# /volume1 and /volume2 are the fallback. install.sh / patch-volumes.sh
# replace those binds with whatever /volume1 … /volume8 is actually mounted
# on the NAS (missing volumes are not created).

name: the-transporter

services:
  the-transporter:
    image: the-transporter:0.2.0
    container_name: the-transporter
    hostname: the-transporter
    restart: unless-stopped
    network_mode: host
    pid: host
    privileged: true
    command: ["transporter_serv", "--port=21011"]
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BROADCAST
      - SYS_ADMIN
    volumes:
      - /volume1:/volume1
      - /volume2:/volume2
      - /home:/home
      - /mnt/@usb:/mnt/@usb:rw
      - /volume1/docker/the-transporter:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Europe/Berlin
      - DATA_DIR=/data
      - WWW_DIR=/www
      - UMASK=022
